<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barovia Ledger — บัญชีค่าเล่น</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0809;--card:#161011;--line:#3a1f22;--tx:#d9cfc6;--mut:#8a7b74;--red:#b3141f;--ok:#6f9a5a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#2a0d11 0,var(--bg) 60%);color:var(--tx);font-family:Sarabun,sans-serif;padding:24px 16px env(safe-area-inset-bottom)}
main{max-width:460px;margin:0 auto}
h1{font-family:Cinzel,serif;text-align:center;color:#e8dcd0;letter-spacing:.08em;margin:24px 0 4px;font-size:1.7rem;text-shadow:0 0 18px #b3141f88}
.sub{text-align:center;color:var(--mut);margin:0 0 28px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 0 30px #000a}
input,textarea{width:100%;background:#0d0a0a;border:1px solid var(--line);color:var(--tx);padding:12px;border-radius:6px;font:inherit;margin-bottom:12px}
textarea{min-height:260px;font-family:monospace;font-size:.8rem}
button{width:100%;background:var(--red);color:#fff;border:0;padding:12px;border-radius:6px;font:600 1rem Sarabun,sans-serif;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--mut);margin-top:8px}
.err{color:#e5646c;min-height:1.2em;margin:8px 0 0;text-align:center;font-size:.9rem}
.name{font-family:Cinzel,serif;font-size:1.4rem;margin:0}
.tbl{color:var(--mut);margin:2px 0 16px}
.status{text-align:center;padding:16px;border-radius:8px;border:1px solid;margin-bottom:16px}
.status b{display:block;font-size:1.8rem;font-family:Cinzel,serif}
.debt{border-color:var(--red);background:#2a0b0e;color:#ff7b84}
.paid{border-color:var(--ok);background:#12200f;color:#9ccf86}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:16px}
.stats div{background:#0d0a0a;border-radius:6px;padding:10px 4px}
.stats b{display:block;font-size:1.3rem}
.stats span{color:var(--mut);font-size:.75rem}
h3{font-family:Cinzel,serif;font-size:1rem;margin:0 0 8px;color:var(--mut)}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
.hide{display:none}
.row{display:flex;gap:8px;align-items:center}.row input{margin:0}.row button{width:auto;white-space:nowrap;padding:10px 12px}
.pr{border-top:1px solid var(--line);padding:10px 0}.pr small{display:block;color:var(--mut);margin:4px 0 8px}
.pr label{display:flex;align-items:center;gap:8px}.pr label input{width:auto;margin:0}
.sum{color:var(--mut);margin:10px 0;font-size:.9rem}details{margin-bottom:12px}summary{cursor:pointer;color:var(--mut);margin-bottom:8px}
.owe{color:#ff7b84}.ok{color:#9ccf86}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.kpi b{display:block;font:700 1.4rem Cinzel,Sarabun,serif}.kpi span{color:var(--mut);font-size:.8rem}
.bar{height:6px;background:#0d0a0a;border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#e0434d)}
.pr summary{color:var(--tx);margin:0}
</style>
</head>
<body>
<main>
<h1>BAROVIA LEDGER</h1>
<p class="sub">บัญชีค่าเล่น · Curse of Strahd</p>

<section id="login" class="card">
  <input id="u" placeholder="Username" autocomplete="username" autocapitalize="none">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <button id="go">เข้าสู่ปราสาท</button>
  <p class="err" id="err"></p>
</section>

<section id="view" class="hide">
  <div class="card">
    <p class="name" id="vName"></p>
    <p class="tbl" id="vTable"></p>
    <div class="status" id="vStatus"></div>
    <div class="stats">
      <div><b id="vSess">0</b><span>เซสชันที่เล่น</span></div>
      <div><b id="vCount">0</b><span>ครั้งที่ชำระ</span></div>
      <div><b id="vTotal">0</b><span>จ่ายรวม (฿)</span></div>
    </div>
    <h3>ประวัติการชำระ</h3>
    <ul id="vList"></ul>
  </div>
  <button class="ghost" id="out">ออกจากระบบ</button>
</section>

<section id="dash" class="hide">
  <p class="sub" style="margin-top:-12px">แดชบอร์ดแอดมิน · เห็นทุกยอดทุกเซสชัน</p>
  <div id="dashBody"></div>
  <button class="ghost" id="out2">ออกจากระบบ</button>
</section>

<section id="admin" class="hide">
  <div class="card">
    <h3>เครื่องมือ DM · ใช้บนเครื่องตัวเองเท่านั้น</h3>
    <p class="sum">บัญชีแอดมิน (ใช้ล็อกอินดูแดชบอร์ดบนเว็บจริง)</p>
    <div class="row" style="margin-bottom:12px"><input id="au" placeholder="Admin username"><input id="ap" placeholder="Admin password"></div>
    <input type="file" id="load" accept=".json">
    <button class="ghost" id="save">ดาวน์โหลดไฟล์ข้อมูลต้นฉบับ (ห้ามอัปโหลดขึ้น GitHub)</button>
  </div>
  <div id="tables"></div>
  <div class="card">
    <details><summary>แก้ข้อมูลดิบ / เพิ่ม-ลบผู้เล่น (JSON)</summary>
      <textarea id="src" spellcheck="false"></textarea>
      <button class="ghost" id="apply">ใช้ข้อมูลนี้</button>
    </details>
    <button id="gen">สร้าง data.json (เข้ารหัสแล้ว)</button>
    <p class="err" id="aerr"></p>
  </div>
</section>
</main>

<script>
const enc=new TextEncoder(),dec=new TextDecoder(),SALT='barovia-ledger-v1';
const $=i=>document.getElementById(i);
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=u=>u.trim().toLowerCase();
const uid=async u=>hex(await crypto.subtle.digest('SHA-256',enc.encode(SALT+norm(u))));
async function key(u,p){
  const m=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode(SALT+norm(u)),iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const baht=n=>n.toLocaleString('th-TH');
const fmt=d=>new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});

async function login(){
  $('err').textContent='';
  const u=$('u').value,p=$('p').value;
  if(!u||!p){$('err').textContent='กรอกให้ครบ';return}
  $('go').disabled=true;
  try{
    const data=await (await fetch('data.json',{cache:'no-store'})).json();
    const rec=data[await uid(u)];
    if(!rec)throw 0;
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},await key(u,p),unb64(rec.ct));
    const d=JSON.parse(dec.decode(pt));d.admin?showAdmin(d):show(d);
  }catch(e){$('err').textContent='Username หรือ Password ไม่ถูกต้อง'}
  $('go').disabled=false;
}

function show(d){
  const sessions=(d.sessions||[]).length,pays=d.payments||[];
  const total=pays.reduce((s,x)=>s+x.amount,0),owed=sessions*d.rate-total;
  $('vName').textContent=d.name;
  $('vTable').textContent=d.table+' · ฿'+d.rate+'/เซสชัน';
  const st=$('vStatus');
  st.className='status '+(owed>0?'debt':'paid');
  st.innerHTML=owed>0?'<span>ยอดค้างชำระ</span><b>฿'+baht(owed)+'</b>':
    '<span>สถานะ</span><b>ชำระครบแล้ว</b>'+(owed<0?'<small>จ่ายล่วงหน้า ฿'+baht(-owed)+'</small>':'');
  $('vSess').textContent=sessions;
  $('vCount').textContent=pays.length;
  $('vTotal').textContent=baht(total);
  const l=$('vList');l.innerHTML='';
  if(!pays.length)l.innerHTML='<li><span>ยังไม่มีการชำระ</span></li>';
  [...pays].reverse().forEach(x=>{
    const li=document.createElement('li');
    li.innerHTML='<span></span><span></span>';
    li.children[0].textContent=fmt(x.date);
    li.children[1].textContent='฿'+baht(x.amount);
    l.appendChild(li);
  });
  $('login').classList.add('hide');$('view').classList.remove('hide');
}

const calc=p=>{const paid=p.payments.reduce((t,x)=>t+x.amount,0);return{paid,owed:p.sessions.length*p.rate-paid}};
const money=n=>'฿'+baht(n);
function showAdmin(d){
  $('login').classList.add('hide');$('dash').classList.remove('hide');
  document.querySelector('main').style.maxWidth='640px';
  const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
  const P=d.players.map(p=>({...p,sessions:[...p.sessions].sort(),...calc(p)}));
  const sum=f=>P.reduce((t,p)=>t+f(p),0);
  const root=$('dashBody');root.innerHTML='';
  const grid=h('div','kpis');
  [['เก็บแล้วรวม',money(sum(p=>p.paid)),'ok'],['ยอดค้างรวม',money(sum(p=>Math.max(p.owed,0))),'owe'],
   ['ผู้เล่นที่ค้าง',P.filter(p=>p.owed>0).length+' / '+P.length,''],['การจ่ายทั้งหมด',sum(p=>p.payments.length)+' ครั้ง','']]
  .forEach(([l,v,c])=>{const k=h('div','kpi');k.append(h('b',c,v),h('span',null,l));grid.append(k)});
  root.append(grid);
  [...new Set(P.map(p=>p.table))].forEach(tn=>{
    const ps=P.filter(p=>p.table===tn).sort((a,b)=>b.owed-a.owed);
    const sess=new Set(ps.flatMap(p=>p.sessions)).size;
    const paid=ps.reduce((t,p)=>t+p.paid,0),owed=ps.reduce((t,p)=>t+Math.max(p.owed,0),0);
    const billed=ps.reduce((t,p)=>t+p.sessions.length*p.rate,0);
    const pct=billed?Math.min(100,Math.round(paid/billed*100)):100;
    const c=h('div','card');
    c.append(h('h3',null,tn+' · ฿'+ps[0].rate+'/เซสชัน'));
    c.append(h('p','sum','จัดแล้ว '+sess+' เซสชัน · เก็บแล้ว '+money(paid)+' · ค้าง '+money(owed)+' · เก็บได้ '+pct+'%'));
    const bar=h('div','bar'),f=h('i');f.style.width=pct+'%';bar.append(f);c.append(bar);
    ps.forEach(p=>{
      const dt=h('details','pr'),sm=h('summary');
      const bd=h('span',p.owed>0?'owe':'ok',p.owed>0?'ค้าง '+money(p.owed):p.owed<0?'ล่วงหน้า '+money(-p.owed):'ครบ');
      bd.style.float='right';
      sm.append(h('b',null,p.name),bd);dt.append(sm);
      dt.append(h('small',null,'เล่น '+p.sessions.length+' เซสชัน · จ่าย '+p.payments.length+' ครั้ง รวม '+money(p.paid)));
      dt.append(h('small',null,'เซสชัน: '+(p.sessions.length?p.sessions.map(fmt).join(', '):'-')));
      dt.append(h('small',null,'การจ่าย: '+(p.payments.length?p.payments.map(x=>fmt(x.date)+' '+money(x.amount)).join(', '):'-')));
      c.append(dt);
    });
    root.append(c);
  });
}
const logout=()=>{$('u').value=$('p').value='';['view','dash'].forEach(i=>$(i).classList.add('hide'));$('login').classList.remove('hide');document.querySelector('main').style.maxWidth=''};
$('go').onclick=login;
$('p').onkeydown=e=>e.key==='Enter'&&login();
$('out').onclick=$('out2').onclick=logout;

addEventListener('hashchange',()=>location.reload());
/* ---------- DM tool: เปิด index.html#admin บนเครื่องตัวเอง ---------- */
if(location.hash==='#admin'){
  $('login').classList.add('hide');$('admin').classList.remove('hide');
  const today=()=>new Date().toISOString().slice(0,10);
  const sample=()=>{const T=[["Monday Team",80,["2026-11-02","2026-11-09","2026-11-16"]],["Thursday Team",79,["2026-11-05","2026-11-12"]]],players=[];
    T.forEach(([table,rate,sessions],t)=>{for(let i=1;i<=5;i++)players.push({username:(t?'thu':'mon')+i,password:'เปลี่ยนรหัส-'+(t?'thu':'mon')+i,name:'ผู้เล่น '+i+' ('+table+')',table,rate,sessions:[...sessions],payments:[]})});
    return{players,admin:{username:'dm',password:'เปลี่ยนรหัสแอดมิน'}}};
  const norm2=o=>{if(!o||!Array.isArray(o.players))throw new Error('ต้องมี players');o.players.forEach(p=>{p.sessions=p.sessions||[];p.payments=p.payments||[]});o.admin=o.admin||{username:'',password:''};return o};
  let S;
  try{S=norm2(JSON.parse(localStorage.getItem('baroviaSrc')))}catch(e){S=sample()}
  const dl=(name,txt)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click()};

  function render(){
    try{localStorage.setItem('baroviaSrc',JSON.stringify(S))}catch(e){}
    $('src').value=JSON.stringify(S,null,1);
    $('au').value=S.admin.username;$('ap').value=S.admin.password;
    const box=$('tables');box.innerHTML='';
    [...new Set(S.players.map(p=>p.table))].forEach(tn=>{
      const ps=S.players.filter(p=>p.table===tn);
      const tot=ps.reduce((a,p)=>{const c=calc(p);a.paid+=c.paid;a.owed+=c.owed;return a},{paid:0,owed:0});
      const d=document.createElement('div');d.className='card';
      d.innerHTML='<h3></h3><div class="row"><input type="date" class="sd" value="'+today()+'"><button class="add">+ เพิ่มเซสชัน</button></div><p class="sum"></p><div class="pl"></div>';
      d.querySelector('h3').textContent=tn+' · ฿'+ps[0].rate+'/เซสชัน';
      d.querySelector('.sum').textContent='เก็บแล้วรวม ฿'+baht(tot.paid)+' · ค้างรวม ฿'+baht(tot.owed)+' · ติ๊กเฉพาะคนที่มาเล่นก่อนกดเพิ่มเซสชัน';
      const pairs=[];
      ps.forEach(p=>{
        const c=calc(p),r=document.createElement('div');r.className='pr';
        r.innerHTML='<label><input type="checkbox" checked class="ck"><b class="nm"></b></label><small></small><div class="row"><input type="number" class="amt" min="0" placeholder="ยอดที่จ่าย ฿"><button class="pay">บันทึกการจ่าย</button></div>';
        r.querySelector('.nm').textContent=p.name+' ('+p.username+')';
        r.querySelector('small').innerHTML='เล่น '+p.sessions.length+' เซสชัน · จ่าย '+p.payments.length+' ครั้ง รวม ฿'+baht(c.paid)+' · '+(c.owed>0?'<span class="owe">ค้าง ฿'+baht(c.owed)+'</span>':'<span class="ok">'+(c.owed<0?'จ่ายล่วงหน้า ฿'+baht(-c.owed):'ชำระครบ')+'</span>');
        const amt=r.querySelector('.amt');if(c.owed>0)amt.value=c.owed;
        r.querySelector('.pay').onclick=()=>{const v=+amt.value;if(v>0){p.payments.push({date:today(),amount:v});render()}};
        pairs.push([r.querySelector('.ck'),p]);
        d.querySelector('.pl').appendChild(r);
      });
      d.querySelector('.add').onclick=()=>{
        const date=d.querySelector('.sd').value;if(!date)return;
        pairs.forEach(([ck,p])=>{if(ck.checked&&!p.sessions.includes(date))p.sessions.push(date)});
        render();
      };
      box.appendChild(d);
    });
  }
  render();

  $('load').onchange=async e=>{try{S=norm2(JSON.parse(await e.target.files[0].text()));render();$('aerr').textContent=''}catch(x){$('aerr').style.color='';$('aerr').textContent='ไฟล์ไม่ถูกต้อง: '+x.message}};
  $('au').oninput=$('ap').oninput=()=>{S.admin={username:$('au').value,password:$('ap').value};try{localStorage.setItem('baroviaSrc',JSON.stringify(S))}catch(e){}};
  $('save').onclick=()=>dl('players-source.json',JSON.stringify(S,null,1));
  $('apply').onclick=()=>{try{S=norm2(JSON.parse($('src').value));render();$('aerr').style.color='#9ccf86';$('aerr').textContent='อัปเดตแล้ว'}catch(x){$('aerr').style.color='';$('aerr').textContent='JSON ผิดพลาด: '+x.message}};
  $('gen').onclick=async()=>{
    try{
      const out={},A=S.admin;
      const seal=async(u,pw,payload)=>{const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(u,pw),enc.encode(JSON.stringify(payload)));out[await uid(u)]={iv:b64(iv),ct:b64(ct)}};
      if(!A.username||!A.password)throw new Error('ต้องตั้ง username/password ของแอดมิน');
      if(S.players.some(p=>norm(p.username||'')===norm(A.username)))throw new Error('username แอดมินซ้ำกับผู้เล่น');
      for(const pl of S.players){
        if(!pl.username||!pl.password)throw new Error('ต้องมี username และ password ทุกคน');
        const {username,password,...payload}=pl;
        await seal(username,password,payload);
      }
      await seal(A.username,A.password,{admin:true,players:S.players.map(({password,...p})=>p)});
      dl('data.json',JSON.stringify(out));
      $('aerr').style.color='#9ccf86';$('aerr').textContent='สร้างแล้ว '+S.players.length+' ผู้เล่น + แอดมิน';
    }catch(e){$('aerr').style.color='';$('aerr').textContent='ผิดพลาด: '+e.message}
  };
}
</script>
</body>
</html>
