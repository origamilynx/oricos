<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barovia Ledger — สมุดบัญชีแห่งบาโรเวีย</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0809;--card:#161011;--line:#3a1f22;--tx:#d9cfc6;--mut:#8a7b74;--red:#b3141f;--ok:#6f9a5a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#2a0d11 0,var(--bg) 60%);color:var(--tx);font-family:Sarabun,sans-serif;padding:24px 16px env(safe-area-inset-bottom)}
main{max-width:460px;margin:0 auto}
h1{font-family:Cinzel,serif;text-align:center;color:#e8dcd0;letter-spacing:.08em;margin:24px 0 4px;font-size:1.7rem;text-shadow:0 0 18px #b3141f88}
.sub{text-align:center;color:var(--mut);margin:0 0 28px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 0 30px #000a}
input,textarea{width:100%;background:#0d0a0a;border:1px solid var(--line);color:var(--tx);padding:12px;border-radius:6px;font:inherit;margin-bottom:12px}
textarea{min-height:260px;font-family:monospace;font-size:.8rem}
button{width:100%;background:var(--red);color:#fff;border:0;padding:12px;border-radius:6px;font:600 1rem Sarabun,sans-serif;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--mut);margin-top:8px}
.err{color:#e5646c;min-height:1.2em;margin:8px 0 0;text-align:center;font-size:.9rem}
.name{font-family:Cinzel,serif;font-size:1.4rem;margin:0}
.tbl{color:var(--mut);margin:2px 0 16px}
.status{text-align:center;padding:16px;border-radius:8px;border:1px solid;margin-bottom:16px}
.status b{display:block;font-size:1.8rem;font-family:Cinzel,serif}
.debt{border-color:var(--red);background:#2a0b0e;color:#ff7b84}
.paid{border-color:var(--ok);background:#12200f;color:#9ccf86}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:16px}
.stats div{background:#0d0a0a;border-radius:6px;padding:10px 4px}
.stats b{display:block;font-size:1.3rem}
.stats span{color:var(--mut);font-size:.75rem}
h3{font-family:Cinzel,serif;font-size:1rem;margin:0 0 8px;color:var(--mut)}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
.hide{display:none}
.row{display:flex;gap:8px;align-items:center}.row input{margin:0}.row button{width:auto;white-space:nowrap;padding:10px 12px}
.pr{border-top:1px solid var(--line);padding:10px 0}.pr small{display:block;color:var(--mut);margin:4px 0 8px}
.pr label{display:flex;align-items:center;gap:8px}.pr label input{width:auto;margin:0}
.sum{color:var(--mut);margin:10px 0;font-size:.9rem}details{margin-bottom:12px}summary{cursor:pointer;color:var(--mut);margin-bottom:8px}
.owe{color:#ff7b84}.ok{color:#9ccf86}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.kpi b{display:block;font:700 1.4rem Cinzel,Sarabun,serif}.kpi span{color:var(--mut);font-size:.8rem}
.bar{height:6px;background:#0d0a0a;border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#e0434d)}
.pr summary{color:var(--tx);margin:0}
.show{display:flex;gap:8px;align-items:center;color:var(--mut);margin:-4px 0 12px;font-size:.9rem}.show input{width:auto;margin:0}
.status small{display:block;font-size:.8rem;margin-top:6px;opacity:.85}
</style>
</head>
<body>
<main>
<h1>BAROVIA LEDGER</h1>
<p class="sub">สมุดบัญชีแห่งบาโรเวีย · Curse of Strahd</p>

<section id="login" class="card">
  <input id="u" placeholder="Username" autocomplete="username" autocapitalize="none">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <label class="show"><input type="checkbox" id="sp"> แสดงรหัสผ่าน</label>
  <button id="go">เข้าสู่ปราสาท</button>
  <p class="err" id="err"></p>
</section>

<section id="view" class="hide">
  <div class="card">
    <p class="name" id="vName"></p>
    <p class="tbl" id="vTable"></p>
    <div class="status" id="vStatus"></div>
    <div class="stats">
      <div><b id="vSess">0</b><span>เซสชันที่เล่น</span></div>
      <div><b id="vCount">0</b><span>ครั้งที่ชำระ</span></div>
      <div><b id="vTotal">0</b><span>ชำระรวม (฿)</span></div>
    </div>
    <h3>เซสชันที่เล่น</h3>
    <ul id="vSessList" style="margin-bottom:16px"></ul>
    <h3>ประวัติการชำระ</h3>
    <ul id="vList"></ul>
  </div>
  <button class="ghost" id="out">ออกจากระบบ</button>
</section>

<section id="dash" class="hide">
  <p class="sub" style="margin-top:-12px">แดชบอร์ดแอดมิน · เห็นทุกยอดทุกเซสชัน</p>
  <div id="dashBody"></div>
  <button class="ghost" id="out2">ออกจากระบบ</button>
</section>


</main>

<script>
const enc=new TextEncoder(),dec=new TextDecoder(),SALT='barovia-ledger-v1';
const $=i=>document.getElementById(i);
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=u=>u.trim().toLowerCase();
const uid=async u=>hex(await crypto.subtle.digest('SHA-256',enc.encode(SALT+norm(u))));
async function key(u,p){
  const m=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode(SALT+norm(u)),iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const baht=n=>n.toLocaleString('th-TH');
const fmt=d=>new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});

async function login(){
  $('err').textContent='';
  const u=$('u').value,p=$('p').value;
  if(!u||!p){$('err').textContent='กรอกให้ครบ';return}
  $('go').disabled=true;
  let d;
  try{
    const data=await (await fetch('data.json',{cache:'no-store'})).json();
    const rec=data[await uid(u)];
    if(!rec)throw 0;
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},await key(u,p),unb64(rec.ct));
    d=JSON.parse(dec.decode(pt));
  }catch(e){$('err').textContent='Username หรือ Password ไม่ถูกต้อง'}
  if(d){try{d.admin?showAdmin(d):show(d)}catch(e){logout();$('err').textContent='แสดงผลไม่สำเร็จ: '+e.message}}
  $('go').disabled=false;
}

function show(d){
  d=clean(d);const sessions=d.sessions.length,pays=d.payments;
  const ss=perSession(d),unpaid=ss.filter(x=>x.owed>0).map(x=>fmt(x.date)).join(', ');
  const total=pays.reduce((s,x)=>s+x.amount,0),disc=pays.reduce((s,x)=>s+(x.discount||0),0),owed=d.sessions.reduce((t,s)=>t+s.price,0)-total-disc;
  $('vName').textContent=d.name;
  $('vTable').textContent=d.table+' · ฿'+d.rate+'/เซสชัน';
  const st=$('vStatus');
  st.className='status '+(owed>0?'debt':'paid');
  st.innerHTML=owed>0?'<span>ยอดรอชำระ</span><b>฿'+baht(owed)+'</b><small>รอชำระเซสชัน: '+unpaid+'</small>':
    '<span>สถานะ</span><b>ชำระครบแล้ว</b>'+(owed<0?'<small>ชำระล่วงหน้า ฿'+baht(-owed)+'</small>':'');
  $('vSess').textContent=sessions;
  $('vCount').textContent=pays.filter(x=>x.amount>0).length;
  $('vTotal').textContent=baht(total);
  const sl=$('vSessList');sl.innerHTML='';
  if(!ss.length)sl.innerHTML='<li><span>ยังไม่มีเซสชัน</span></li>';
  [...ss].reverse().forEach(x=>{
    const li=document.createElement('li');li.innerHTML='<span></span><span></span>';
    li.children[0].textContent=fmt(x.date)+' · ฿'+baht(x.price)+(x.note?' · '+x.note:'');
    const st=li.children[1];st.className=x.owed>0?'owe':'ok';
    st.textContent=x.price===0?'ฟรี':x.owed===0?'✓ ชำระแล้ว':'⧗ รอชำระ ฿'+baht(x.owed)+(x.paid>0?' (ชำระแล้ว ฿'+baht(x.paid)+')':'');
    sl.appendChild(li);
  });
  const l=$('vList');l.innerHTML='';
  if(!pays.length)l.innerHTML='<li><span>ยังไม่มีการชำระ</span></li>';
  [...pays].reverse().forEach(x=>{
    const li=document.createElement('li');
    li.innerHTML='<span></span><span></span>';
    li.children[0].textContent=fmt(x.date);
    li.children[1].textContent=payAmt(x);
    l.appendChild(li);
  });
  $('login').classList.add('hide');$('view').classList.remove('hide');
}

const sDate=s=>typeof s==='string'?s:s.date;
const sPrice=(p,s)=>(typeof s==='string'||s.price==null)?p.rate:+s.price;
// วันที่ซ้ำ: นับครั้งเดียว ถ้ามีทั้งแบบข้อความและแบบมีราคา/หมายเหตุ ใช้แบบหลัง
const dedupe=l=>{const m=new Map();(l||[]).forEach(s=>{if(s==null)return;const d=sDate(s);if(!m.has(d)||typeof s!=='string')m.set(d,s)});return[...m.values()]};
const calc=p=>{const paid=p.payments.reduce((t,x)=>t+(+x.amount||0),0),disc=p.payments.reduce((t,x)=>t+(+x.discount||0),0),billed=p.sessions.reduce((t,s)=>t+sPrice(p,s),0);return{paid,disc,billed,owed:billed-paid-disc}};
const payAmt=x=>(x.amount>0?'฿'+baht(x.amount):'')+(x.discount?(x.amount>0?' + ':'')+'ส่วนลด ฿'+baht(x.discount):'')+(x.note?' · '+x.note:'');
const nPaid=p=>p.payments.filter(x=>x.amount>0).length;
const money=n=>'฿'+baht(n);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^\d.\-]/g,''));return isFinite(n)?n:NaN};
function clean(p,issues){
  const nm=p.name||p.username||'?',bad=m=>issues&&issues.push(nm+': '+m);
  let rate=num(p.rate);if(!(rate>=0)){bad('ค่าเล่นต่อเซสชัน (rate) ไม่ถูกต้อง '+JSON.stringify(p.rate)+' → นับเป็น 0');rate=0}
  const raw=Array.isArray(p.sessions)?p.sessions:(bad('ไม่มีรายการเซสชัน'),[]),uniq=dedupe(raw);
  if(uniq.length<raw.length)bad('มีเซสชันวันที่ซ้ำ '+(raw.length-uniq.length)+' รายการ → นับครั้งเดียว (ใช้รายการที่มีราคา/หมายเหตุ) ควรลบรายการซ้ำใน admin.html');
  const ss=uniq.map(s=>{
    if(typeof s==='string')return{date:s,price:rate};
    const pr=s&&s.price!=null?num(s.price):rate;
    if(isNaN(pr)){bad('ราคาเซสชันไม่ถูกต้อง '+JSON.stringify(s)+' → ใช้ราคาปกติ');return{...s,price:rate}}
    return{...s,price:pr}});
  const pays=(Array.isArray(p.payments)?p.payments:(bad('ไม่มีรายการชำระเงิน'),[])).map(x=>{
    if(typeof x==='string')return{date:x,for:x,amount:rate,discount:0};
    const dsc=num(x&&x.discount)||0,a=(x&&x.amount==null)?0:num(x&&x.amount);
    if(isNaN(a)||(x&&x.amount==null&&!dsc)){bad('ยอดชำระไม่ถูกต้อง '+JSON.stringify(x)+' → นับเป็น 0');return{...x,amount:0,discount:dsc}}
    return{...x,amount:a,discount:dsc}});
  return{...p,rate,sessions:ss,payments:pays};
}
// ตัดยอดที่จ่ายไปปิดเซสชันเก่าสุดก่อน
// จ่ายระบุวันที่ (for) ตัดเซสชันนั้นตรงๆ ส่วนที่เหลือตัดเซสชันเก่าสุดก่อน
// ยอดเกินราคา (หรือจ่ายให้วันที่ไม่มีเซสชัน) ไหลไปตัดเซสชันเก่าสุดที่ยังค้าง ให้ผลรวมตรงกับยอดค้างรวม
const perSession=p=>{const pays=p.payments||[],direct={};
  const ses=dedupe(p.sessions||[]).sort((a,b)=>sDate(a)<sDate(b)?-1:sDate(a)>sDate(b)?1:0);
  pays.forEach(x=>{if(x.for)direct[x.for]=(direct[x.for]||0)+x.amount+(x.discount||0)});
  const have=new Set(ses.map(sDate));
  let left=pays.filter(x=>!x.for).reduce((t,x)=>t+x.amount+(x.discount||0),0)
    +Object.keys(direct).filter(d=>!have.has(d)).reduce((t,d)=>t+direct[d],0);
  const rows=ses.map(s=>{const date=sDate(s),price=sPrice(p,s),d=direct[date]||0;left+=Math.max(0,d-price);
    return{date,price,note:typeof s==='string'?'':(s.note||''),paid:Math.min(d,price)}});
  rows.forEach(r=>{const t=Math.min(left,r.price-r.paid);r.paid+=t;left-=t;r.owed=r.price-r.paid});
  return rows};
function showAdmin(d){
  $('login').classList.add('hide');$('dash').classList.remove('hide');
  document.querySelector('main').style.maxWidth='640px';
  const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
  const issues=[],P=d.players.map(p=>{const c=clean(p,issues);return{...c,...calc(c)}});
  const sum=f=>P.reduce((t,p)=>t+f(p),0);
  const root=$('dashBody');root.innerHTML='';
  const grid=h('div','kpis');
  [['เก็บแล้วรวม',money(sum(p=>p.paid)),'ok'],['ยอดรอชำระรวม',money(sum(p=>Math.max(p.owed,0))),'owe'],
   ['ผู้เล่นที่รอชำระ',P.filter(p=>p.owed>0).length+' / '+P.length,''],['การชำระทั้งหมด',sum(nPaid)+' ครั้ง','']]
  .forEach(([l,v,c])=>{const k=h('div','kpi');k.append(h('b',c,v),h('span',null,l));grid.append(k)});
  root.append(grid);
  if(issues.length){const w=h('div','card');w.append(h('h3','owe','⚠ พบข้อมูลผิดปกติ — แก้ใน admin.html แล้วสร้าง data.json ใหม่'));
    issues.forEach(m=>w.append(h('small',null,m)));root.append(w)}
  [...new Set(P.map(p=>p.table))].forEach(tn=>{
    const ps=P.filter(p=>p.table===tn).sort((a,b)=>b.owed-a.owed);
    const sess=new Set(ps.flatMap(p=>p.sessions.map(s=>s.date))).size;
    const paid=ps.reduce((t,p)=>t+p.paid,0),owed=ps.reduce((t,p)=>t+Math.max(p.owed,0),0);
    const billed=ps.reduce((t,p)=>t+p.billed,0);
    const pct=billed?Math.min(100,Math.round(paid/billed*100)):100;
    const c=h('div','card');
    c.append(h('h3',null,tn+' · ฿'+ps[0].rate+'/เซสชัน'));
    c.append(h('p','sum','จัดแล้ว '+sess+' เซสชัน · เก็บแล้ว '+money(paid)+' · รอชำระ '+money(owed)+' · เก็บได้ '+pct+'%'));
    const bar=h('div','bar'),f=h('i');f.style.width=pct+'%';bar.append(f);c.append(bar);
    ps.forEach(p=>{
      const dt=h('details','pr'),sm=h('summary');
      const bd=h('span',p.owed>0?'owe':'ok',p.owed>0?'รอชำระ '+money(p.owed):p.owed<0?'ล่วงหน้า '+money(-p.owed):'ครบ');
      bd.style.float='right';
      sm.append(h('b',null,p.name),bd);dt.append(sm);
      dt.append(h('small',null,'เล่น '+p.sessions.length+' เซสชัน · ชำระ '+nPaid(p)+' ครั้ง รวม '+money(p.paid)));
      const ss=perSession(p),un=ss.filter(x=>x.owed>0);
      dt.append(h('small',null,'เซสชันที่เล่น: '+(ss.length?ss.map(x=>fmt(x.date)+(x.price!==p.rate?' ['+money(x.price)+']':'')+(x.owed>0?' ✗':' ✓')).join(', '):'-')));
      if(un.length)dt.append(h('small','owe','ขาดชำระ: '+un.map(x=>fmt(x.date)+(x.paid>0?' (รอชำระ ฿'+baht(x.owed)+')':'')).join(', ')));
      dt.append(h('small',null,'การชำระ: '+(p.payments.length?p.payments.map(x=>fmt(x.date)+' '+payAmt(x)).join(', '):'-')));
      c.append(dt);
    });
    root.append(c);
  });
}
const logout=()=>{$('u').value=$('p').value='';['view','dash'].forEach(i=>$(i).classList.add('hide'));$('login').classList.remove('hide');document.querySelector('main').style.maxWidth=''};
$('sp').onchange=e=>{$('p').type=e.target.checked?'text':'password'};
$('go').onclick=login;
$('p').onkeydown=e=>{if(e.key==='Enter')login()};
$('out').onclick=$('out2').onclick=logout;

</script>
</body>
</html>
